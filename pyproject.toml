[project]
name = "kb"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "sentence-transformers>=5.6.0",
    "sqlalchemy>=2.0.51",
    "sqlite-vec>=0.1.9",
    "watchfiles>=1.2.0",
]

[project.optional-dependencies]
anki = ["anki>=25.0"]

[dependency-groups]
dev = ["pytest>=8.0", "mypy>=1.13"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["*.py", "kb_cli", "scripts"]
plugins = ["sqlalchemy.ext.mypy.plugin"]
