[project]
name = "kb"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "anki>=25.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "lxml>=6.1.1",
    "pypdf>=6.15.0",
    "readability-lxml>=0.8.4.1",
    "sentence-transformers>=5.6.0",
    "sqlalchemy>=2.0.51",
    "sqlite-vec>=0.1.9",
    "uvicorn>=0.52.1",
    "watchfiles>=1.2.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "mypy>=1.13", "pre-commit>=4.0", "time-machine>=2.16", "pytest-cov>=6.0", "black>=25.0"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["*.py", "kb_cli", "scripts"]
plugins = ["sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = "readability"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=. --cov-report=term-missing"

[tool.coverage.run]
omit = ["tests/*", ".venv/*", "alembic/*"]

[tool.black]
line-length = 120
target-version = ["py312"]
extend-exclude = "alembic/versions/"
